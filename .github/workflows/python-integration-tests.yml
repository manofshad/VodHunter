name: Python integration tests

on:
  pull_request:
    branches:
      - main

jobs:
  python-integration-tests:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vodhunter_test
          POSTGRES_USER: vodhunter
          POSTGRES_PASSWORD: vodhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vodhunter -d vodhunter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://vodhunter:vodhunter@localhost:5432/vodhunter_test
      VODHUNTER_TEST_DATABASE_URL: postgresql://vodhunter:vodhunter@localhost:5432/vodhunter_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-api-public.txt
            backend/requirements-nmfp.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration
