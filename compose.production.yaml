name: vodhunter

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    # DATABASE_URL points to the standalone Coolify PostgreSQL/PGVector
    # resource. Database lifecycle is intentionally outside this stack.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    environment:
      TIKTOK_DOWNLOADER: ${TIKTOK_DOWNLOADER:-yt-dlp}
      COBALT_API_URL: ${COBALT_API_URL:-http://cobalt:9000/}
    expose:
      - "8000"
    volumes:
      - runtime_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      API_URL: http://cobalt:9000/
      DURATION_LIMIT: "180"
      CORS_WILDCARD: "0"
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/').then(async r => { const j = await r.json(); if (!r.ok || !j.cobalt?.services?.includes('tiktok')) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.0
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?GRAFANA_CLOUD_PROMETHEUS_URL must be set in .env}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:?GRAFANA_CLOUD_PROMETHEUS_USER must be set in .env}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?GRAFANA_CLOUD_LOKI_URL must be set in .env}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?GRAFANA_CLOUD_LOKI_USER must be set in .env}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:?GRAFANA_CLOUD_API_TOKEN must be set in .env}
      VODHUNTER_ENVIRONMENT: ${VODHUNTER_ENVIRONMENT:-production}
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "--disable-reporting",
        "/etc/alloy/config.alloy"
      ]
    expose:
      - "12345"
    volumes:
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    command:
      [
        "python",
        "-m",
        "runners.run_hybrid_ingest",
        "--days",
        "${HYBRID_INGEST_DAYS:-30}"
      ]
    volumes:
      - runtime_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  vod-retention:
    build:
      context: .
      dockerfile: Dockerfile.retention
    env_file:
      - .env
    command: ["python", "-m", "runners.run_vod_retention"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web-public:
    build:
      context: .
      dockerfile: Dockerfile.web-public
      args:
        VITE_API_BASE: /api
    environment:
      PUBLIC_API_UPSTREAM: http://api:8000
    labels:
      - 'traefik.http.middlewares.vodhunter-canonical-redirect.redirectregex.regex=^https?://(www\.vodhunter\.dev|vodhunter\.dev|www\.vodhunter\.com)(.*)$'
      - 'traefik.http.middlewares.vodhunter-canonical-redirect.redirectregex.replacement=https://vodhunter.com$${2}'
      - 'traefik.http.middlewares.vodhunter-canonical-redirect.redirectregex.permanent=true'
      - 'coolify.traefik.middlewares=vodhunter-canonical-redirect'
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  runtime_data:
    # Keep the existing shared runtime volume when Coolify deploys this stack.
    name: vodhunter_runtime_data
    external: true
  alloy_data:
    name: vodhunter_alloy_data
