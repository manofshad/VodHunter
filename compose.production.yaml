name: vodhunter

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vodhunter}
      POSTGRES_USER: ${POSTGRES_USER:-vodhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - runtime_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api-public
    env_file:
      - .env
    command:
      [
        "python",
        "-m",
        "runners.run_hybrid_ingest",
        "--streamer",
        "${TWITCH_STREAMER:-jasontheween}",
        "--days",
        "${HYBRID_INGEST_DAYS:-30}"
      ]
    volumes:
      - runtime_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  vod-retention:
    build:
      context: .
      dockerfile: Dockerfile.retention
    env_file:
      - .env
    command: ["python", "-m", "runners.run_vod_retention"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web-public:
    build:
      context: .
      dockerfile: Dockerfile.web-public
      args:
        VITE_API_BASE: /api
    environment:
      PUBLIC_API_UPSTREAM: http://api:8000
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-public:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  runtime_data:
  caddy_data:
  caddy_config:
