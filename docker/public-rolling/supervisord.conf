[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[eventlistener:exit-watchdog]
command=python /app/docker/public-rolling/exit_watchdog.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
startsecs=0
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=python -m uvicorn backend.apps.public:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 10 --log-config /app/backend/logging.json
directory=/app
priority=10
startsecs=0
startretries=0
autorestart=false
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
startsecs=0
startretries=0
autorestart=false
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
